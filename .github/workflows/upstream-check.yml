name: Upstream Solar check

on:
  schedule:
    # Mondays 06:00 UTC. Upstream adds icons every few weeks, so weekly is
    # frequent enough to hear about it without being noise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare catalog with Iconify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reuses tool/fetch_icons.py's own resolution, so the report cannot
      # disagree with what a real regeneration would do. Exits non-zero if
      # the API returns nothing, so a network failure is not reported as
      # "no new icons".
      - name: Check upstream
        id: check
        run: |
          python tool/check_upstream.py \
            --markdown upstream-report.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Add report to run summary
        if: always()
        run: cat upstream-report.md >> "$GITHUB_STEP_SUMMARY" || true

      # One issue, reused. A fresh issue every week for the same pending
      # sync would train everyone to ignore it.
      - name: Open or update the sync issue
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream Solar has new icons"
          BODY="$(cat upstream-report.md)
          
          _Generated by the weekly upstream check ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))._"
          EXISTING=$(gh issue list --label upstream-sync --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh label create upstream-sync \
              --description "Catalog drift against upstream Solar" \
              --color 0E8A16 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label upstream-sync
          fi

      # Close the issue once a sync has landed, so the label reflects reality.
      - name: Close the sync issue when nothing is pending
        if: steps.check.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label upstream-sync --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Catalog is level with upstream again — closing automatically."
          fi
