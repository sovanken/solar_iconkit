name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Test against the minimum Flutter version declared in pubspec.yaml so we
  # catch accidental use of newer APIs that would break the stated minimum.
  min-flutter:
    name: Analyze & test (Ubuntu · Flutter 3.27.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.27.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: solar_iconkit
          fail_ci_if_error: false
        # Public repos also accept tokenless uploads, but passing the token
        # explicitly gives faster + more reliable ingest and lets Codecov
        # correlate upload with the pull-request source.

  # Cross-platform check on the current stable channel. Windows and macOS
  # skip the golden tag because pixel-level rasterization can differ across
  # platforms and produce false regressions.
  stable-cross-platform:
    name: Analyze & test (${{ matrix.os }} · Flutter stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests (Ubuntu — includes goldens)
        if: matrix.os == 'ubuntu-latest'
        run: flutter test

      - name: Run tests (Windows/macOS — skip goldens)
        if: matrix.os != 'ubuntu-latest'
        run: flutter test --exclude-tags golden

  # Packaging and pub.dev scoring, so a problem surfaces on the PR rather
  # than at tag time when the version is already public. The release
  # workflow runs the same two checks as a final gate.
  package:
    name: Package & pub.dev score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # TEMPORARY: identify why a fresh checkout reports a dirty tree.
      - name: Diagnose dirty tree
        run: |
          echo "--- porcelain ---"
          git status --porcelain
          echo "--- diff (analysis options) ---"
          git diff -- analysis_options.yaml example/analysis_options.yaml | cat -A | head -40

      - name: Validate package
        run: flutter pub publish --dry-run

      # pana needs the webp tools to process the `screenshots:` declared in
      # pubspec.yaml; without them it logs SEVERE and can lose points that
      # pub.dev's own analysis would grant.
      - name: Install pana prerequisites
        run: sudo apt-get update && sudo apt-get install -y webp

      # Asserted from pana's JSON rather than its exit code: a crashed
      # analysis can still exit 0, which would make this gate silently
      # useless. The package scores 160/160 on pub.dev, so any shortfall is
      # a regression, and the failing section is named in the log.
      - name: Score with pana
        run: |
          flutter pub global activate pana
          flutter pub global run pana --no-warning --json . > pana.json
          python3 tool/assert_pana_score.py pana.json
