name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Test against the minimum Flutter version declared in pubspec.yaml so we
  # catch accidental use of newer APIs that would break the stated minimum.
  min-flutter:
    name: Analyze & test (Ubuntu · Flutter 3.27.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.27.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: solar_iconkit
          fail_ci_if_error: false
        # Uses CODECOV_TOKEN from repository secrets. Public repos can also
        # upload tokenlessly, but a token increases upload reliability.

  # Cross-platform check on the current stable channel. Windows and macOS
  # skip the golden tag because pixel-level rasterization can differ across
  # platforms and produce false regressions.
  stable-cross-platform:
    name: Analyze & test (${{ matrix.os }} · Flutter stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests (Ubuntu — includes goldens)
        if: matrix.os == 'ubuntu-latest'
        run: flutter test

      - name: Run tests (Windows/macOS — skip goldens)
        if: matrix.os != 'ubuntu-latest'
        run: flutter test --exclude-tags golden
