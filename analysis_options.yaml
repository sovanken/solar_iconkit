include: package:flutter_lints/flutter.yaml

analyzer:
  # Enforce the strictest type-checking Dart offers. Every implicit
  # dynamic / raw type becomes an error, catching real bugs at compile
  # time instead of at runtime.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - "lib/src/solar_iconkit_data.g.dart"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Const-correctness — helps Flutter skip rebuilds and reduces allocations.
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_const_declarations
    # Hygiene.
    - avoid_print
    - unnecessary_this
    - avoid_empty_else
    - avoid_returning_null_for_void
    - unnecessary_null_checks
    # Public-API hygiene — prevents leaking private types.
    - library_private_types_in_public_api
    # Async correctness.
    - use_build_context_synchronously
    - avoid_slow_async_io
    # Dependency hygiene.
    - depend_on_referenced_packages
