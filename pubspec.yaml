name: solar_iconkit
description: >-
  Solar icon kit for Flutter. 1,247 icons in 6 native styles — linear, outline,
  broken, bold, line-duotone, bold-duotone — behind a single SolarIcon widget.
version: 1.1.0

homepage: https://solar-icons-web.vercel.app
repository: https://github.com/sovanken/solar_iconkit
issue_tracker: https://github.com/sovanken/solar_iconkit/issues
documentation: https://pub.dev/documentation/solar_iconkit/latest/

funding:
  - https://ko-fi.com/sovanken

topics:
  - icons
  - svg
  - ui
  - iconography
  - widgets

screenshots:
  - description: The interactive icon browser — 1,247 Solar icons across 6 native styles, filterable by category
    path: screenshots/browser-grid.png
  - description: Icon detail view — each icon in all 6 native styles, with Flutter widget code and download formats
    path: screenshots/style-comparison.png
  - description: SolarIcon widget rendered in common Flutter UI patterns — menu, sidebar, button, toolbar
    path: screenshots/widget-in-app.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Deliberately spans both majors rather than pinning. flutter_lints 6.x
  # requires Dart 3.8+, so contributors on our declared minimum (Flutter 3.27
  # / Dart 3.6) resolve 5.x and can still run `pub get`, while newer SDKs get
  # 6.x. CI analyzes on both — the pinned 3.27 job covers 5.x and the stable
  # matrix covers 6.x — so neither side goes unchecked.
  #
  # Do not narrow this to `^6.0.0`: that breaks `pub get` on the declared
  # minimum, which is why an earlier bump had to be reverted (see 5ddbd67).
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  assets:
    - assets/icons/linear/
    - assets/icons/outline/
    - assets/icons/broken/
    - assets/icons/bold/
    - assets/icons/line_duotone/
    - assets/icons/bold_duotone/