name: solar_iconkit
description: >-
  Solar icon kit for Flutter. 1,231 icons in 6 native styles — linear, outline,
  broken, bold, line-duotone, bold-duotone — behind a single SolarIcon widget.
version: 0.3.2

homepage: https://solar-icons-web.vercel.app
repository: https://github.com/sovankentech/solar_iconkit
issue_tracker: https://github.com/sovankentech/solar_iconkit/issues
documentation: https://pub.dev/documentation/solar_iconkit/latest/

funding:
  - https://ko-fi.com/sovanken

topics:
  - icons
  - svg
  - ui
  - iconography
  - widgets

# Once screenshots are captured (see screenshots/README.md), uncomment
# this block and re-publish. pub.dev renders these on the package page.
# screenshots:
#   - description: All 1,231 Solar icons in the interactive browser
#     path: screenshots/browser-grid.png
#   - description: Six native styles side-by-side
#     path: screenshots/style-comparison.png
#   - description: SolarIcon widget used across common Flutter UI patterns
#     path: screenshots/widget-in-app.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/linear/
    - assets/icons/outline/
    - assets/icons/broken/
    - assets/icons/bold/
    - assets/icons/line_duotone/
    - assets/icons/bold_duotone/